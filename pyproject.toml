[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tableturf-rebuild"
version = "0.1.0"
description = "Clean-room Tableturf Battle automation core"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AutoTableTurf contributors" }]
dependencies = []

[project.optional-dependencies]
controller = ["pyserial>=3.5,<4"]
vision = [
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<13",
]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8.3,<9"]

[project.scripts]
tableturf = "tableturf_rebuild.cli:main"
tableturf-video-review = "tableturf_rebuild.capture.video_review_ui:run_default_video_review"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tableturf_rebuild = [
    "data/game/*.json",
    "data/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

